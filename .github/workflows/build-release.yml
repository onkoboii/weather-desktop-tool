name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Собрать приложение
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name WeatherDesktopTool app.py

          if [ "${{ matrix.name }}" = "windows" ]; then
            cp dist/WeatherDesktopTool.exe WeatherDesktopTool-windows.exe
          elif [ "${{ matrix.name }}" = "macos" ]; then
            cp dist/WeatherDesktopTool WeatherDesktopTool-macos
            zip WeatherDesktopTool-macos.zip WeatherDesktopTool-macos
          else
            cp dist/WeatherDesktopTool WeatherDesktopTool-linux
            chmod +x WeatherDesktopTool-linux
          fi

      - name: Загрузить Windows-файл
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: WeatherDesktopTool-windows
          path: WeatherDesktopTool-windows.exe

      - name: Загрузить macOS-файл
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: WeatherDesktopTool-macos
          path: WeatherDesktopTool-macos.zip

      - name: Загрузить Linux-файл
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: WeatherDesktopTool-linux
          path: WeatherDesktopTool-linux
